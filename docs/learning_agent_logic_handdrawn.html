<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个性化学习多智能体系统逻辑结构图</title>
  <style>
    html, body {
      margin: 0;
      width: 1800px;
      height: 1250px;
      overflow: hidden;
      background: #f7f2e8;
      font-family: "Comic Sans MS", "Marker Felt", "STKaiti", "Kaiti SC", "Hiragino Sans GB", sans-serif;
    }

    svg {
      width: 1800px;
      height: 1250px;
      display: block;
      background:
        radial-gradient(circle at 14% 12%, rgba(77, 168, 218, 0.10), transparent 260px),
        radial-gradient(circle at 82% 18%, rgba(240, 142, 93, 0.12), transparent 280px),
        radial-gradient(circle at 70% 88%, rgba(91, 184, 143, 0.12), transparent 300px),
        #f7f2e8;
    }

    .title {
      font-size: 44px;
      font-weight: 700;
      fill: #263238;
      letter-spacing: 0;
    }

    .subtitle {
      font-size: 22px;
      fill: #5b6268;
    }

    .label {
      font-size: 24px;
      font-weight: 700;
      fill: #25313a;
    }

    .small {
      font-size: 18px;
      fill: #44515b;
    }

    .tiny {
      font-size: 16px;
      fill: #4b5963;
    }

    .node {
      stroke: #263238;
      stroke-width: 3.2;
      filter: url(#softShadow);
    }

    .sketch {
      fill: none;
      stroke: #263238;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#roughen);
    }

    .arrow {
      fill: none;
      stroke: #263238;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrowHead);
      filter: url(#roughen);
    }

    .dash {
      stroke-dasharray: 10 9;
    }

    .badge {
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <defs>

    </filter>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
